[project]
name = "python_misc_utils"
version = "0.31"
description = "A collection of Python utility APIs"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
license-files = ["LICEN[CS]E*"]
license = "Apache-2.0"
dependencies = [
  "numpy",
  "pandas",
  "psutil",
  "pytz",
  "python-dateutil",
  "pyyaml",
]

[[project.authors]]
name = "Davide Libenzi"
email = "davide.libenzi@gmail.com"

[project.optional-dependencies]
fs = [
  "boto3",
  "bs4",
  "ftputil",
  "google-cloud-storage",
  "pyarrow",
]
test = [
  "beautifulsoup4",
  "coverage",
  "ftputil",
  "httpx",
  "msgpack",
  "moto",
  "pillow",
  "pyftpdlib",
  "pytest",
  "pytest-cov",
  "requests",
  "scikit-learn",
]
torch = ["torch"]
all = [
  "python_misc_utils[fs,test,torch]",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
]

[project.urls]
Homepage = "https://github.com/davidel/py_misc_utils"
Issues = "https://github.com/davidel/py_misc_utils/issues"
Repository = "https://github.com/davidel/py_misc_utils.git"
Documentation = "https://davidel.github.io/py_misc_utils/"

[build-system]
requires = ["setuptools >= 42.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["py_misc_utils*"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = '-q --strict-markers -m "not needs_network and not legacy_fork"'
markers = [
  "slow: long-running tests (kept on by default, deselect with -m 'not slow')",
  "needs_network: tests that require real internet access (deselected by default)",
  "legacy_fork: tests using the fork start method (deselected by default; fork must stay tested - opt in with -m legacy_fork)",
]
filterwarnings = [
  # ftputil 5.x warns about the upcoming encoding change in 6.0.0; the
  # remote filesystems used in tests are ASCII/UTF-8 safe.
  "ignore:In ftputil 6.0.0, the default file path encoding will change",
  # pyftpdlib still imports asyncore/asynchat, which warn on import; the
  # warning cannot be avoided from our side (fixed in newer pyftpdlib).
  "ignore:The asyncore module is deprecated",
  "ignore:The asynchat module is deprecated",
]

[tool.ruff.lint]
# dict(...) keyword style is used pervasively across the codebase; keep it.
# Root-logger calls are the intended dispatch mechanism for alog and for
# low-level modules that deliberately avoid importing alog.
ignore = ["C408", "LOG015"]

[tool.ruff.lint.isort]
# Never combine imports on one line (from X import a, b is banned).
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"py_misc_utils/debug.py" = ["T100"]
