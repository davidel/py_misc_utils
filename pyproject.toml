[project]
name = "python_misc_utils"
version = "0.30"
description = "A collection of Python utility APIs"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
license-files = ["LICEN[CS]E*"]
license = "Apache-2.0"
dependencies = [
  "numpy",
  "pandas",
  "psutil",
  "pytz",
  "python-dateutil",
  "pyyaml",
]

[[project.authors]]
name = "Davide Libenzi"
email = "davide.libenzi@gmail.com"

[project.optional-dependencies]
fs = [
  "boto3",
  "bs4",
  "ftputil",
  "google-cloud-storage",
  "pyarrow",
]
test = [
  "msgpack",
  "moto",
  "pyftpdlib",
  "pytest",
  "pytest-cov",
]
torch = ["torch"]

[project.urls]
Homepage = "https://github.com/davidel/py_misc_utils"
Issues = "https://github.com/davidel/py_misc_utils/issues"
Repository = "https://github.com/davidel/py_misc_utils.git"

[build-system]
requires = ["setuptools >= 42.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["py_misc_utils*"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = '-q --strict-markers -m "not needs_network"'
markers = [
  "slow: long-running tests (kept on by default, deselect with -m 'not slow')",
  "needs_network: tests that require real internet access (deselected by default)",
]
